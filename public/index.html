<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valo Mağaza</title>
<style>
:root{--bg:#0f1923;--card:#1b2733;--red:#ff4655;--tx:#ece8e1;--mut:#8b978f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #2a3a48}
h1{margin:0;font-size:20px;color:var(--red);letter-spacing:2px}
main{max-width:1000px;margin:0 auto;padding:24px}
button,select,input{font:inherit;border-radius:4px;border:1px solid #34495a;background:var(--card);color:var(--tx);padding:10px 14px}
button{cursor:pointer;background:var(--red);border:0;font-weight:600}button.ghost{background:transparent;border:1px solid #34495a}
.steps li{margin:10px 0;color:var(--mut)}.steps b{color:var(--tx)}
input{width:100%;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}
nav{display:flex;gap:8px;margin-bottom:20px}nav button{background:var(--card)}nav button.on{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);padding:14px;border-radius:6px;text-align:center}
.card img{width:100%;height:90px;object-fit:contain}.card h3{font-size:14px;margin:8px 0}
.vp{color:#f5c542}.old{text-decoration:line-through;color:var(--mut);margin-right:6px}.pct{color:var(--red)}
.mut{color:var(--mut)}.err{color:var(--red)}.hide{display:none}
</style>
</head>
<body>
<header><h1>VALO MAĞAZA</h1><div><span id="who" class="mut"></span> <button id="out" class="ghost hide">Çıkış</button></div></header>
<main>
<section id="login">
  <h2>Giriş</h2>
  <p class="mut">Şifreni bu siteye girmiyorsun. Giriş Riot'un kendi sayfasında yapılır.</p>
  <ol class="steps">
    <li><b>1.</b> <button id="open">Riot ile giriş yap</button> (yeni sekmede açılır)</li>
    <li><b>2.</b> Giriş yapınca <i>playvalorant.com</i> sayfasına yönlenirsin (boş/hata sayfası normal).</li>
    <li><b>3.</b> Adres çubuğundaki <b>tüm URL'yi</b> kopyala ve aşağı yapıştır:</li>
  </ol>
  <input id="url" placeholder="https://playvalorant.com/opt_in#access_token=...">
  <div class="row">
    <select id="shard"><option value="eu">Avrupa / Türkiye (EU)</option><option value="na">Kuzey Amerika</option><option value="ap">Asya Pasifik</option><option value="kr">Kore</option></select>
    <button id="go">Devam</button>
  </div>
  <p id="lerr" class="err"></p>
</section>
<section id="app" class="hide">
  <nav><button data-t="daily" class="on">Mağaza</button><button data-t="night">Gece Pazarı</button><button data-t="skins">Skinlerim</button></nav>
  <p id="info" class="mut"></p>
  <div id="list" class="grid"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);let sid=sessionStorage.sid||null,data={},tab="daily";
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{"Content-Type":"application/json","x-session":sid||"",...(o.headers||{})}});const j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error||"Hata"),{status:r.status});return j};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+"g ":"")+h+"sa "+m+"dk"};
function card(s){const p=s.discountPrice!=null?`<span class="old">${s.price}</span><span class="vp">${s.discountPrice} VP</span> <span class="pct">-%${s.percent}</span>`:(s.price!=null?`<span class="vp">${s.price} VP</span>`:"");
 return `<div class="card"><img src="${esc(s.icon||"")}" alt=""><h3>${esc(s.name)}</h3><div>${p}</div></div>`}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const l=$("#list"),i=$("#info");
 if(tab==="daily"){i.textContent="Yenilenmesine: "+dur(data.store.dailyRemaining||0);l.innerHTML=data.store.daily.map(card).join("")}
 else if(tab==="night"){if(!data.store.night){i.textContent="Şu an aktif bir Gece Pazarı yok.";l.innerHTML=""}else{i.textContent="Bitişine: "+dur(data.store.nightRemaining||0);l.innerHTML=data.store.night.map(card).join("")}}
 else{i.textContent=data.skins.count+" skin";l.innerHTML=data.skins.skins.map(card).join("")}}
async function load(){try{const[st,sk]=await Promise.all([api("/api/store"),api("/api/skins")]);data={store:st,skins:sk};$("#login").classList.add("hide");$("#app").classList.remove("hide");$("#out").classList.remove("hide");render()}
 catch(e){if(e.status===401){sessionStorage.removeItem("sid");sid=null;$("#login").classList.remove("hide");$("#app").classList.add("hide")}$("#lerr").textContent=e.message}}
$("#open").onclick=async()=>window.open((await api("/api/login-url")).url,"_blank");
$("#go").onclick=async()=>{$("#lerr").textContent="";try{const r=await api("/api/login",{method:"POST",body:JSON.stringify({url:$("#url").value,shard:$("#shard").value})});sid=r.sid;sessionStorage.sid=sid;$("#who").textContent=r.name;$("#url").value="";load()}catch(e){$("#lerr").textContent=e.message}};
$("#out").onclick=async()=>{await api("/api/logout",{method:"POST"}).catch(()=>{});sessionStorage.removeItem("sid");location.reload()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
if(sid)load();
</script>
</body>
</html>
